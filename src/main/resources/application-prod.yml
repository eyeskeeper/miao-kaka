# 生产环境配置：敏感信息一律走环境变量，不进代码与镜像
spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:miaokaka}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}

jwt:
  secret: ${JWT_SECRET:}
  expire-days: ${JWT_EXPIRE_DAYS:7}

# 自定义配置（生产）
app:
  cache:
    enabled: ${CACHE_ENABLED:false}
  storage:
    type: ${STORAGE_TYPE:local}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      bucket: ${ALIYUN_OSS_BUCKET:}
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  invite:
    base-url: ${INVITE_BASE_URL:}
  ai:
    vision:
      enabled: ${VISION_ENABLED:false}
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_VISION_API_KEY:}
      model: ${VISION_MODEL:glm-4v-flash}
      timeout-seconds: 8

server:
  servlet:
    context-path: /api
  port: 18089

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
