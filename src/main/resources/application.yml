spring:
  application:
    name: miaokaka
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_db
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  servlet:
    context-path: /api
  port: 18089

# JWT（生产环境用环境变量覆盖 secret）
jwt:
  secret: miao-kaka-dev-secret-do-not-use-in-prod
  expire-days: 7

# 应用自定义配置
app:
  # Redis 缓存开关（本机 Redis 已启动；关闭时所有缓存读写直接跳过，行为与无缓存一致）
  cache:
    enabled: true
  # 上传图片存储目录（本地磁盘实现，二期可换 OSS）
  upload-dir: ./data/uploads
  ai:
    vision:
      # 智谱 GLM-4V 凭证预审开关（未配 key 时自动退化为纯组长人工审核）
      enabled: false
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key:
      model: glm-4v-flash
      timeout-seconds: 8

# springdoc-openapi
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs

  paths-to-match: '/**'
  packages-to-scan: com.senze.miaokaka.controller
