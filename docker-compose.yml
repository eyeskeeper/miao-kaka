services:
  mysql:
    image: mysql:8.4
    container_name: miaokaka-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: miaokaka
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01_create_table.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: miaokaka-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: miaokaka-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: miaokaka
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      UPLOAD_DIR: /data/uploads
      VISION_ENABLED: ${VISION_ENABLED:-false}
      ZHIPU_VISION_API_KEY: ${ZHIPU_VISION_API_KEY:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_HOST: redis
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - upload-data:/data/uploads
    expose:
      - "18089"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: miaokaka-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书：放置 fullchain.pem 与 privkey.pem（如 Let's Encrypt）
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  mysql-data:
  upload-data:
